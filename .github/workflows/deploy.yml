name: CI/CD - Deploy to Amazon EKS

on:
  push:
    branches:
      - ci-cd
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: customer-analysis-cluster
  ECR_REGISTRY: 851725415355.dkr.ecr.us-east-1.amazonaws.com

jobs:

  build-dashboard:
    name: Build & Push Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_ACCESS_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Dashboard image 
        run: |
          docker build -t $ECR_REGISTRY/dashboard:${{ github.sha }} \
            ./Services/dashboard
          docker push $ECR_REGISTRY/dashboard:${{ github.sha }}

  #data service configu
  build-data-service:
    name: Build & Push data-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_ACCESS_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push data-service image
        run: |
          docker build -t $ECR_REGISTRY/data-service:${{ github.sha }} \
            ./Services/data-service
          docker push $ECR_REGISTRY/data-service:${{ github.sha }}

  build-nlp-service:
    name: Build & Push nlp-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_ACCESS_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push nlp-service image
        run: |
          docker build -t $ECR_REGISTRY/nlp-service:${{ github.sha }} \
            ./Services/nlp-service
          docker push $ECR_REGISTRY/nlp-service:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-dashboard, build-data-service, build-nlp-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_ACCESS_TOKEN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG=${{ github.sha }}

          sed -i "s|image: .*dashboard.*|image: $ECR_REGISTRY/dashboard:$IMAGE_TAG|g" \
            ./k8s/dashboard.yaml

          sed -i "s|image: .*data-service.*|image: $ECR_REGISTRY/data-service:$IMAGE_TAG|g" \
            ./k8s/data-service.yaml

          sed -i "s|image: .*nlp-service.*|image: $ECR_REGISTRY/nlp-service:$IMAGE_TAG|g" \
            ./k8s/nlp-service.yaml

      - name: Deploy Dashboard
        run: kubectl apply -f ./k8s/dashboard.yaml

      - name: Deploy data-service
        run: kubectl apply -f ./k8s/data-service.yaml

      - name: Deploy nlp-service
        run: kubectl apply -f ./k8s/nlp-service.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/dashboard --timeout=120s
          kubectl rollout status deployment/data-service --timeout=120s
          kubectl rollout status deployment/nlp-service --timeout=120s

      - name: Get LoadBalancer URL
        run: |
          echo "Dashboard URL:"
          kubectl get svc dashboard -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'