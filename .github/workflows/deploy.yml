name: CI/CD — Build & Deploy to EKS

on:
  push:
    branches:
      - main
    workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: customer-analysis-cluster
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_ACCESS_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_ACCOUNT_ID: 125474202777
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  
  build-and-push-dashboard-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build, tag, and push dashboard image to Amazon ECR
        id: build-image
        run: |
          docker build -t $ECR_REGISTRY/dashboard:${{ steps.meta.outputs.tag }} \
            ./microservices/dashboard
          docker push $ECR_REGISTRY/dashboard:${{ steps.meta.outputs.tag }}

     
  build-data-service:
    name: Build & Push data-service
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build, tag and push data-service image
        run: |
          docker build -t $ECR_REGISTRY/data-service:${{ steps.meta.outputs.tag }} \
            ./microservices/data-service
          docker push $ECR_REGISTRY/data-service:${{ steps.meta.outputs.tag }}

 
  build-nlp-service:
    name: Build & Push nlp-service
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build, tag and push nlp-service image
        run: |
          docker build -t $ECR_REGISTRY/nlp-service:${{ steps.meta.outputs.tag }} \
            ./microservices/nlp-service
          docker push $ECR_REGISTRY/nlp-service:${{ steps.meta.outputs.tag }}
     

      - name: Deploy to EKS cluster
        run: |
          kubectl set image deployment/customer-analysis-deployment customer-analysis-app=${{ steps.build-image.outputs.image }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-dashboard, build-data-service, build-nlp-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG=${{ github.sha }}

          # Dashboard
          sed -i "s|image: .*dashboard.*|image: $ECR_REGISTRY/dashboard:$IMAGE_TAG|g" \
            ./k8s/dashboard/deployment.yaml

          # data-service
          sed -i "s|image: .*data-service.*|image: $ECR_REGISTRY/data-service:$IMAGE_TAG|g" \
            ./k8s/data-service/deployment.yaml

          # nlp-service
          sed -i "s|image: .*nlp-service.*|image: $ECR_REGISTRY/nlp-service:$IMAGE_TAG|g" \
            ./k8s/nlp-service/deployment.yaml

      - name: Deploy Dashboard
        run: |
          kubectl apply -f ./k8s/dashboard/

      - name: Deploy data-service
        run: |
          kubectl apply -f ./k8s/data-service/

      - name: Deploy nlp-service
        run: |
          kubectl apply -f ./k8s/nlp-service/

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/dashboard --timeout=120s
          kubectl rollout status deployment/data-service --timeout=120s
          kubectl rollout status deployment/nlp-service --timeout=120s

      - name: Get LoadBalancer URL
        run: |
          echo "Dashboard URL:"
          kubectl get svc dashboard -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'