apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: customer-analysis-cluster
  region: us-east-1
  version: "1.35"

# AWS Academy: Use LabRole for cluster and nodes
iam:
  serviceRoleARN: arn:aws:iam::125474202777:role/c204605a5216167l14080137t1w125474-LabEksClusterRole-4rV3E2GnkvcZ

managedNodeGroups:
  - name: ai-nodes
    instanceType: t3.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 5
    volumeSize: 30
    # AWS Academy: Use LabRole for node group
    iam:
      instanceRoleARN: arn:aws:iam::125474202777:role/c204605a5216167l14080137t1w125474202-LabEksNodeRole-8UCNoOptvNEb
    tags:
      Project: AI-Cluster
      Environment: Lab

# Addons
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
