apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: customer-analysis-cluster
  region: us-east-1
  version: "1.35"

# AWS Academy: Use LabRole for cluster and nodes
iam:
  serviceRoleARN: arn:aws:iam::471112964070:role/c193145a4965754l14197347t1w471112-LabEksClusterRole-fc1lFNFaAxm1

managedNodeGroups:
  - name: ai-nodes
    instanceType: t3.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 5
    volumeSize: 30
    # AWS Academy: Use LabRole for node group
    iam:
      instanceRoleARN: arn:aws:iam::471112964070:role/c193145a4965754l14197347t1w471112964-LabEksNodeRole-146B7aSNuMrl
    tags:
      Project: AI-Cluster
      Environment: Lab

# Addons
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
